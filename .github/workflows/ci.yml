name: tests

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install configured portable Godot and export templates
        run: python -X utf8 tools/project.py setup
      - name: Content parity and isolated game tests
        run: python -X utf8 tools/project.py test --skip-shots
      - name: Fresh Windows export and smoke
        run: python -X utf8 tools/project.py export
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: |
            build/check-*/results.json
            build/check-*/*.log
            build/check-*/artifact.json
